name: CI

on:
  push:
    branches: [main, "ci-trial/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Runs in the public repository. In the development repository it runs
    # only on ci-trial/* branches, where release candidates are validated
    # before main advances.
    if: >-
      github.repository == 'SkyShannonProver/shannon-prover'
      || startsWith(github.ref, 'refs/heads/ci-trial/')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --frozen

      - uses: ./.github/actions/easycrypt-toolchain

      - name: Run the test suite
        run: uv run python -m pytest -q tests

      - name: Plan the demo without calling a model
        run: uv run python -m eval_suite.run --suite eval_suite/suites/demo_pir.json --dry-run
